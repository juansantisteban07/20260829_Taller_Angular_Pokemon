<!-- Formulario de búsqueda.
     (keyup.enter) permite buscar presionando Enter dentro del input. -->
<form class="formulario" (ngSubmit)="onBuscar()">
  <label class="etiqueta" for="campoBusqueda">Nombre o ID</label>

  <div class="fila">
    <input
      id="campoBusqueda"
      class="campo"
      type="text"
      placeholder="Ej: pikachu o 25"
      [(ngModel)]="texto"
      name="busqueda"
      (keyup.enter)="onBuscar()"
      autocomplete="off"
    />
    <button class="boton" type="submit">Buscar Pokémon</button>
  </div>

  <!-- Mensaje de validación cuando el campo está vacío. -->
  @if (errorFormulario) {
    <p class="error">{{ errorFormulario }}</p>
  }
</form>
